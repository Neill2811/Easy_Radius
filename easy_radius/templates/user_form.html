{% extends "base.html" %}
{% block title %}{{ title }} · Easy Radius{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{{ title }}</h1>
  <a href="{{ url_for('users') }}">Back to users</a>
</div>
<div class="card">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ user.username }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" value="{{ user.password }}" required autocomplete="off">
    <label for="group">Group</label>
    <select id="group" name="group">
      {% for group in groups %}
      <option value="{{ group }}" {% if user.group == group %}selected{% endif %}>{{ group }}</option>
      {% endfor %}
    </select>
    <p class="help">The group is written as Mikrotik-Group.</p>
    <button type="submit">Save</button>
  </form>
</div>
{% endblock %}
