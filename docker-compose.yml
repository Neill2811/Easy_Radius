# Easy Radius controls the host's FreeRADIUS. network_mode host means the
# web UI listens on the host's port 8088, so ufw rules apply as usual.
# privileged, pid host, and nsenter are how the container runs freeradius
# and systemctl in the host's namespaces.
services:
  radius-admin:
    build: .
    container_name: radius-admin
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /etc/freeradius:/etc/freeradius
      - ./data:/opt/radius-admin/data
    environment:
      RADIUS_ADMIN_DATA_DIR: /opt/radius-admin/data
      RADIUS_ADMIN_USE_NSENTER: "1"
      RADIUS_ADMIN_CLIENTS_CONF: /etc/freeradius/3.0/clients.conf
      RADIUS_ADMIN_USERS_FILE: /etc/freeradius/3.0/mods-config/files/authorize
